name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned by commit SHA (tag in the comment), like every other download; bumping one needs review.

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS; Windows joins when it is supported. macOS minutes count extra
        # while the repo is private.
        os: [ubuntu-latest, macos-latest]
        # Oldest supported version and the newest release.
        python: ["3.9", "3.x"]
        exclude:
          # setup-python has no 3.9 build for ubuntu-latest (26.04); 24.04 still has one.
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Install ruff
        run: python -m pip install ruff==0.17.1
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      - name: shellcheck
        run: shellcheck ornith-launcher
      - name: shellcheck a generated Claude Code wrapper
        run: |
          python - <<'PY'
          import sys, tempfile
          from pathlib import Path
          sys.path[:0] = ["src", "."]
          from ornith_launcher.integrations.claude_code import wrapper_script
          from tests.runtime_fixtures import profile
          Path("wrapper.sh").write_text(wrapper_script(profile(Path(tempfile.mkdtemp()))))
          PY
          shellcheck wrapper.sh
