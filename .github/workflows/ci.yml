name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux only while the repo is private, to save Actions minutes (macOS and Windows
        # minutes count extra). Use the second line once the repo is public.
        os: [ubuntu-latest]
        # os: [ubuntu-latest, macos-latest, windows-latest]
        # Oldest supported version and the newest release.
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install ruff
        run: python -m pip install ruff==0.17.1
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      - name: shellcheck
        run: shellcheck ornith-launcher
      - name: shellcheck a generated Claude Code wrapper
        run: |
          python - <<'PY'
          import sys, tempfile
          from pathlib import Path
          sys.path[:0] = ["src", "."]
          from ornith_launcher.integrations.claude_code import wrapper_script
          from tests.runtime_fixtures import profile
          Path("wrapper.sh").write_text(wrapper_script(profile(Path(tempfile.mkdtemp()))))
          PY
          shellcheck wrapper.sh
